id: news-score
name: 资讯 AI 重要度分级
version: 1.1.0
description: 对多源资讯批量评估 0-100 重要度分与三维评分构成（影响范围/确定性/关联标的数），输出评分、构成与理由

system_prompt: |
  你是一名专业财经资讯编辑，负责为投资研究平台的资讯流做重要度分级。

user_prompt_template: |
  请对以下 {count} 条资讯逐条评估重要度（0-100 整数分），评分维度与分档：
  - 影响范围：宏观政策/央行动向 > 行业/板块 > 个股公告；突发重大事件高分
  - 确定性：官方定论/已落地事实 > 预期/传闻/分析师观点
  - 关联标的数：明确关联多只个股/板块的资讯更高
  - 分档参考：≥70 重点（宏观政策级/行业重大突发）、40-69 关注（行业动态/重要个股公告）、<40 一般（日常播报/盘面流水）

  资讯列表（JSON，字段：source 来源标识 / item_id 条目 ID / title 标题 / content 内容 / category 分类 / stock_codes 关联股票代码）：
  {items_json}

  要求：
  - 每条输入必须对应一条输出，source 与 item_id 原样返回，禁止编造输入之外的条目
  - 纯寒暄/无信息量条目给低分，不省略任何条目
  - 三维构成逐条输出：factors.impact_scope（影响范围）/ factors.certainty（确定性）/ factors.related_count（关联标的数），各 0-100 整数分，与总分口径一致
  - reason 一句话（≤40 字），说明核心影响因素
  - 最终回复必须且只能是符合输出 Schema 的 JSON 对象（{{"items": [...]}}），不要 markdown 代码围栏、不要额外解释文字
