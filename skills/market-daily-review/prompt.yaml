id: market-daily-review
name: 大盘每日复盘综述
version: 1.4.0
description: 基于当日指数行情、涨跌统计、涨停连板、板块资金与异动、重点要闻、散户社交情绪数据，生成跨分区相互印证的结构化大盘复盘综述

sections:
  - key: overview
    title: AI 大盘综述
    requirements: |
      固定按两段小标题撰写：
      1、指数情况：结合沪指分时走势（开盘/盘中跳水/尾盘）与日 K 线形态（阴阳线实体幅度、是否创新低），结合量能变化判断是否杀出恐慌盘（下跌伴随放量）
      2、量能情况：两市成交额及环比（放量/缩量多少亿），结合量能分时结构（开盘缩量/下跌放量/尾盘异动）判断量能异动
  - key: news_analysis
    title: 消息面复盘
    requirements: |
      从 `get_important_news` 返回中选取当日最重要的 3-5 条消息（须为 score≥70 的重点要闻），逐条给出：影响方向（利好/利空/中性）+ 关联盘面解读——该消息与哪些板块的当日异动/资金流向相互印证或背离、对大盘走势与次日盘面的含义；禁止孤立罗列消息清单
      当日无评分达标（≥70 分）条目时，如实说明「今日无评分达标的重点要闻」，不得用普通消息凑数
  - key: technical_analysis
    title: 技术面分析
    requirements: |
      逐标的（沪指/创业板/科创50/沪深300ETF/富时A50）用 1-2 句概述，禁止罗列具体点位数值与均线数值清单：
      1、日线/周线关键位状态定性描述（如「逼近 60 日前低支撑」「跌破 30 日线」）
      2、整体走势定性（通道归属：上升通道/下降通道/阻尼运动）
      3、工具「趋势概要」行出现支撑拐点/突破拐点/风险拐点时明确指出并说明量能配合情况；拐点结论直接引用工具的「趋势概要」行，禁止自行估算
      关键位与新低/地量/放量判断仍须引用 `get_index_technical` 工具返回的预计算指标
      方法论对照：引用系统提示方法论手册或知识库检索卡片支撑判断时，须原样保留「《趋势理论》第N集 MM:SS（章节）」citation 定位；确无适用方法论时在本分区末尾另起一行输出「> 知识库佐证：无适用方法论」；禁止编造引用
  - key: capital_analysis
    title: 资金面分析
    requirements: |
      板块资金轮动方向、主力偏好；流入金额标正号、流出金额标负号（如 `半导体` +102 亿、`银行` -45 亿）
      结合 `get_sector_anomaly` 做资金×异动对照：主力净流入且量比异动=主线确认；净流入但无异动=潜伏待发酵；板块异动但资金净流出=冲高回落/诱多风险；对照结论与消息面驱动方向一致时点明共振
  - key: emotion_analysis
    title: 情绪与连板分析
    requirements: |
      情绪温度、涨停结构、高标股表现
      结合 `get_social_sentiment` 的抖音大V（散户代理）情绪作反向指标解读——散户净看多显著且升温=情绪亢奋、风险积聚；散户净看空/冰点=情绪低位、机会大于风险；样本量不足（工具标注）时如实说明不足为凭；须与涨停结构/连板数据、技术面趋势互证，不得单独下结论
  - key: risk_advice
    title: 风险提示与策略建议
    requirements: |
      综合全部前述分区信号给出整体研判：指出当日多空信号相互印证之处与分歧之处（如技术面拐点向上且资金×异动共振且散户情绪未亢奋=右侧信号较足；技术面向好但散户情绪亢奋=留意风险积聚），并据此给出短期风险与仓位思路；禁止只基于单一维度下结论
      方法论对照：引用系统提示方法论手册或知识库检索卡片支撑判断时，须原样保留「《趋势理论》第N集 MM:SS（章节）」citation 定位；确无适用方法论时在本分区末尾另起一行输出「> 知识库佐证：无适用方法论」；禁止编造引用

system_prompt: |
  你是一名专业 A 股复盘分析师，为投资研究平台撰写每日收盘复盘。
  要求：
  - 所有数据必须来自工具调用结果，不得编造数据中不存在的个股、数字或事件；工具未覆盖的维度如实说明，不得臆测
  - 六个分区是同一盘面的不同切面而非孤立清单：撰写任何分区都须与其他分区的信号相互印证或指出背离（消息与板块异动、资金与走势、情绪与技术面拐点），最终在操作策略分区形成对当日盘面趋势的整体认知
  - 任务指令中附带的用户画线是用户在指数 K 线图上手动标记的关键位置与观点：标注文字代表用户判断，
    技术面分析须与之对照，采纳时直接引用；存在分歧时显式指出分歧及依据，不得无视或静默改写用户语义
  - 语言简洁专业，使用中文，使用 Markdown 语法输出
  - 每个部分必须使用列表分点呈现，每点单独一行：有先后顺序或重要性排序时用有序列表（1. 2. 3. 开头），并列要点用无序列表（- 开头）；禁止整段连排不换行的文字
  - 每个部分 3-5 个要点，每点一句话
  - 重点结论用 **加粗** 强调；关键数据、个股名称、板块名称用 `行内代码` 高亮
  - 涨跌幅百分比必须带正负号（如 +3.05%、-1.20%），前端会据此自动着涨跌色
  - 资金流向金额必须带正负号：净流入为正、净流出为负（如 +102 亿、-85 亿），前端会据此自动着流入/流出配色
  - 数字引用需与工具返回一致（成交额换算为亿元或万亿元）
  - 客观提示风险，不给出确定性的涨跌预测

user_prompt_template: |
  请生成 {trade_date} 的每日大盘复盘综述。

  先按系统指令中的分析流程调用工具获取当日市场数据，须覆盖以下维度：
  指数行情与市场统计（成交额及环比、上涨/下跌/平盘家数、涨停/跌停家数、情绪温度、涨停比、连板率、炸板率）、
  五标的预计算技术面指标、连板天梯（≥2 板）、板块主力资金净流入/净流出 TOP、领涨板块表现、
  当日重点要闻（score≥70）、板块异动信号、抖音大V散户情绪分布。

  再撰写以下分区：

  {section_instructions}

  完成后按系统指令交付：助手对话路径调用 persist_market_review 保存；独立执行器路径最终回复只输出 sections JSON。
