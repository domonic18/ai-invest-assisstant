x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "${WEB_PORT}:9000"
    env_file:
      - .env
    environment:
      DEBUG: ${DEBUG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  celery-beat:
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    env_file:
      - .env
    environment:
      COLLECTOR_MODE: beat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    networks:
      - app-network

  celery-worker-realtime:
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    env_file:
      - .env
    environment:
      COLLECTOR_MODE: worker
      COLLECTOR_QUEUE: ${CELERY_REALTIME_QUEUE}
      COLLECTOR_CONCURRENCY: ${CELERY_REALTIME_CONCURRENCY}
      COLLECTOR_MAX_TASKS_PER_CHILD: ${CELERY_REALTIME_MAX_TASKS_PER_CHILD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-m", "celery", "-A", "collector.celery_app", "inspect", "ping", "-t", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  celery-worker-batch:
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    env_file:
      - .env
    environment:
      COLLECTOR_MODE: worker
      COLLECTOR_QUEUE: ${CELERY_BATCH_QUEUE}
      COLLECTOR_CONCURRENCY: ${CELERY_BATCH_CONCURRENCY}
      COLLECTOR_MAX_TASKS_PER_CHILD: ${CELERY_BATCH_MAX_TASKS_PER_CHILD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-m", "celery", "-A", "collector.celery_app", "inspect", "ping", "-t", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  celery-worker-heavy:
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    env_file:
      - .env
    environment:
      COLLECTOR_MODE: worker
      COLLECTOR_QUEUE: ${CELERY_HEAVY_QUEUE}
      COLLECTOR_CONCURRENCY: ${CELERY_HEAVY_CONCURRENCY}
      COLLECTOR_MAX_TASKS_PER_CHILD: ${CELERY_HEAVY_MAX_TASKS_PER_CHILD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-m", "celery", "-A", "collector.celery_app", "inspect", "ping", "-t", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

networks:
  app-network:
    driver: bridge
