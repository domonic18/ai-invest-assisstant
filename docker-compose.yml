services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "9000:9000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

  collector:
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - COLLECT_TASK=${COLLECT_TASK:-default}
