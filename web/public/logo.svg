<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- tech ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.9"/>
  <!-- crosshair -->
  <line x1="32" y1="5" x2="32" y2="17" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="47" x2="32" y2="59" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="5" y1="32" x2="17" y2="32" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="47" y1="32" x2="59" y2="32" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- core eye -->
  <circle cx="32" cy="32" r="11" fill="url(#core)"/>
  <circle cx="32" cy="32" r="5" fill="#0b1020"/>
  <!-- rising signal bars -->
  <g stroke-linecap="round">
    <line x1="18" y1="44" x2="18" y2="52" stroke="#3b82f6" stroke-width="2.5"/>
    <line x1="25" y1="38" x2="25" y2="52" stroke="#22d3ee" stroke-width="2.5"/>
    <line x1="32" y1="32" x2="32" y2="52" stroke="#60a5fa" stroke-width="2.5"/>
    <line x1="39" y1="40" x2="39" y2="52" stroke="#06b6d4" stroke-width="2.5"/>
    <line x1="46" y1="46" x2="46" y2="52" stroke="#3b82f6" stroke-width="2.5"/>
  </g>
</svg>
