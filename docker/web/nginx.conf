user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # 仅当请求来自 HTTPS 终止层（外层 nginx 转发 X-Forwarded-Proto: https）
    # 才启用 CSP upgrade-insecure-requests；localhost 直连 HTTP 时留空，避免
    # 浏览器把 http://localhost:9000/api/ 升级为 https 导致 network error。
    map $http_x_forwarded_proto $csp_upgrade_value {
        https   "upgrade-insecure-requests";
        default "";
    }

    server {
        listen 9000;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 带内容哈希的静态产物：长缓存
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # SPA 入口：禁止启发式缓存，保证发版后立即生效
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
            # HSTS: 强制浏览器对该域名使用 HTTPS（1 年），覆盖子域名
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            # 混合内容自动升级（仅 HTTPS 来源）: 浏览器把页面内所有 http:// 请求自动改写为 https://
            add_header Content-Security-Policy $csp_upgrade_value always;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # SCF 入口恒为 HTTPS，但平台经 HTTP 转发到容器：无条件改写该头，
            # 否则 FastAPI redirect_slashes 的 307 Location 会生成 http://，
            # HTTPS 页面追加该请求即被浏览器按混合内容拦截（uvicorn 侧已开 --proxy-headers）
            proxy_set_header X-Forwarded-Proto https;
            # AI 分析类接口（产业链/复盘）LLM 调用可达 1-2 分钟
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /docs {
            proxy_pass http://127.0.0.1:8000/docs;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /openapi.json {
            proxy_pass http://127.0.0.1:8000/openapi.json;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /health {
            proxy_pass http://127.0.0.1:8000/health;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:8000/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
