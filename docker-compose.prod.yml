x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  douyin-signer:
    # 抖音页面签名 sidecar：chromium warm 页 SDK 真签（Argus 门禁对抗，见 docs/arch/08）。
    # 仅 image 直拉（CI 构建；服务器境内无代理，playwright CDN 构建不了）；
    # 无 depends_on：独立服务，不可用时采集侧自动回退本地 a_bogus
    image: ccr.ccs.tencentyun.com/domonic18/douyin-signer:${APP_TAG:-latest}
    environment:
      TZ: Asia/Shanghai
    tmpfs:
      # chromium 用户 Profile 写 /tmp；tmpfs 避免容器层 IO 与崩溃残留
      - /tmp/playwright-profiles
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 2G

  paper-trade:
    # 掘金线上仿真交易 sidecar：REST 网关接 sim.myquant.cn 网页版同款柜台
    # （gmtrade SDK 云端 TCP 网关已废弃，见 docker/paper-trade/main.py 头注释）。
    # 仅 image 直拉（CI 构建）；8020 发布宿主机供 SCF 公网直连（web 由 SCF 承载），
    # 公网可达性由轻量控制台防火墙管控（建议仅放行 SCF 固定出口 IP）
    image: ccr.ccs.tencentyun.com/domonic18/paper-trade:${APP_TAG:-latest}
    environment:
      TZ: Asia/Shanghai
      # 无状态多租户：掘金 token/account_id 由 app 服务层逐请求经 X-Gm-Token /
      # X-Gm-Account-Id 头传入（存库加密，见后台「模拟盘账户」），不落 sidecar 环境。
      # 留空 = 经 discovery.myquant.cn 服务发现柜台地址；柜台漂移时可在 .env 钉死
      GMTRADE_BROKER_URL: ${GMTRADE_BROKER_URL:-}
      # 通道共享密钥：与全部调用方（worker env_file / SCF 控制台 env）同值；
      # 留空 = 不校验（仅限纯内网部署；此处发布端口公网可达，生产必须配置）
      PAPER_TRADE_SHARED_SECRET: ${PAPER_TRADE_SHARED_SECRET:?PAPER_TRADE_SHARED_SECRET required in .env}
    ports:
      - "8020:8020"
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512m

  celery-beat:
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    image: ccr.ccs.tencentyun.com/domonic18/collector:${APP_TAG:-latest}
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      COLLECTOR_MODE: beat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    networks:
      - app-network

  celery-worker:
    # realtime+batch 合并单容器：batch 定点盘后、realtime 盘中，时间窗错开互不挤占；
    # 队列仍为 3 条，仅容器数收缩。
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    image: ccr.ccs.tencentyun.com/domonic18/collector:${APP_TAG:-latest}
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      COLLECTOR_MODE: worker
      COLLECTOR_QUEUE: ${CELERY_WORKER_QUEUES:-collector.realtime,collector.batch}
      COLLECTOR_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
      COLLECTOR_MAX_TASKS_PER_CHILD: ${CELERY_WORKER_MAX_TASKS_PER_CHILD:-200}
      # 掘金仿真 sidecar（compose 服务名直连；置空禁用模拟盘功能）
      PAPER_TRADE_URL: ${PAPER_TRADE_URL:-http://paper-trade:8020}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-m", "celery", "-A", "collector.celery_app", "inspect", "ping", "-t", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # 2G：社媒回填/增量采集含「拉流→ffmpeg 抽音轨→ASR」媒体流水线，1G 曾被 OOM 杀（2026-09-16）
          memory: 2G

  celery-worker-heavy:
    # LLM 分钟级任务（复盘/归因）独占容器，并发=1，不与通用采集池混跑
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    image: ccr.ccs.tencentyun.com/domonic18/collector:${APP_TAG:-latest}
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      COLLECTOR_MODE: worker
      COLLECTOR_QUEUE: ${CELERY_HEAVY_QUEUE:-collector.heavy}
      COLLECTOR_CONCURRENCY: ${CELERY_HEAVY_CONCURRENCY:-1}
      COLLECTOR_MAX_TASKS_PER_CHILD: ${CELERY_HEAVY_MAX_TASKS_PER_CHILD:-10}
      PAPER_TRADE_URL: ${PAPER_TRADE_URL:-http://paper-trade:8020}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-m", "celery", "-A", "collector.celery_app", "inspect", "ping", "-t", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  collector-stream:
    # 财联社电报驻留采集：10s 轮询写 news_telegraph，游标/心跳存 Redis，
    # 独立进程不占 Celery 池
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    image: ccr.ccs.tencentyun.com/domonic18/collector:${APP_TAG:-latest}
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      COLLECTOR_MODE: stream
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      # 心跳键由 stream 每 10s 刷新（TTL 120s），TTL>0 即数据流存活
      test: ["CMD-SHELL", "python -c \"import os, redis; exit(0 if redis.from_url(os.environ['REDIS_URL']).ttl('collector:stream:cls_telegraph:heartbeat') > 0 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./workspace/postgres:/var/lib/postgresql/data
      - ./docker/database/init-scripts:/docker-entrypoint-initdb.d
    # 发布到宿主机供 SCF 经轻量公网 IP 直连（不走云联网/VPC）；
    # 公网可达性由轻量控制台防火墙管控，放行 5432 前确认 POSTGRES_PASSWORD 足够强
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *logging
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    # 发布到宿主机供 SCF 经轻量公网 IP 直连；公网可达必须密码认证：
    # REDIS_PASSWORD 硬必需（漏配则 compose 直接报错，避免无密码 Redis 暴露公网）；
    # 连接方 URL 需同步改为 redis://:密码@redis:6379/n
    #（server .env 的 REDIS_URL 与两个 CELERY_*URL）
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging: *logging
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
