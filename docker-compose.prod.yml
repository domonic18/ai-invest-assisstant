x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    # image 供服务器 docker compose pull 定位 TCR；build 保留给本地与应急构建；
    # APP_TAG 在服务器 .env 钉版（CI git 短 sha），缺省 latest
    image: ccr.ccs.tencentyun.com/domonic18/web-api:${APP_TAG:-latest}
    # 生产环境不暴露 web 容器端口，仅通过 Caddy 反向代理访问。
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      DEBUG: ${DEBUG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  celery-beat:
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    image: ccr.ccs.tencentyun.com/domonic18/collector:${APP_TAG:-latest}
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      COLLECTOR_MODE: beat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    networks:
      - app-network

  celery-worker:
    # realtime+batch 合并单容器：batch 定点盘后、realtime 盘中，时间窗错开互不挤占；
    # 队列仍为 3 条，仅容器数收缩。
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    image: ccr.ccs.tencentyun.com/domonic18/collector:${APP_TAG:-latest}
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      COLLECTOR_MODE: worker
      COLLECTOR_QUEUE: ${CELERY_WORKER_QUEUES:-collector.realtime,collector.batch}
      COLLECTOR_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
      COLLECTOR_MAX_TASKS_PER_CHILD: ${CELERY_WORKER_MAX_TASKS_PER_CHILD:-200}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-m", "celery", "-A", "collector.celery_app", "inspect", "ping", "-t", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  celery-worker-heavy:
    # LLM 分钟级任务（复盘/归因）独占容器，并发=1，不与通用采集池混跑
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    image: ccr.ccs.tencentyun.com/domonic18/collector:${APP_TAG:-latest}
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      COLLECTOR_MODE: worker
      COLLECTOR_QUEUE: ${CELERY_HEAVY_QUEUE:-collector.heavy}
      COLLECTOR_CONCURRENCY: ${CELERY_HEAVY_CONCURRENCY:-1}
      COLLECTOR_MAX_TASKS_PER_CHILD: ${CELERY_HEAVY_MAX_TASKS_PER_CHILD:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-m", "celery", "-A", "collector.celery_app", "inspect", "ping", "-t", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./workspace/postgres:/var/lib/postgresql/data
      - ./docker/database/init-scripts:/docker-entrypoint-initdb.d
    # 生产环境通常不暴露数据库端口；若需调试可临时打开。
    # ports:
    #   - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *logging
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    # ports:
    #   - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging: *logging
    networks:
      - app-network

  elasticsearch:
    image: elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    # ports:
    #   - "${ELASTICSEARCH_PORT}:9200"
    volumes:
      - ./workspace/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *logging
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./workspace/caddy/data:/data
      - ./workspace/caddy/config:/config
    depends_on:
      - web
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
