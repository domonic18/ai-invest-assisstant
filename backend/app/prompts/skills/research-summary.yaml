id: research-summary
name: 研报摘要
version: 1.0.0
model: openai/gpt-4o
description: 对指定公司或行业的券商研报进行批量摘要提取，输出结构化观点

triggers:
  - 用户要求查看某公司研报观点
  - 用户要求对比多家券商对同一公司的看法
  - 用户要求跟踪评级变化

workflow:
  - 从 PostgreSQL 查询目标公司最近的研报元数据
  - 从 MinIO 获取研报 PDF 文件路径
  - 从 Milvus 知识库检索研报文本切片
  - 提取每篇研报的关键信息
  - 对比评级变化，计算一致度和分歧

system_prompt: |
  你是一个券商研报分析专家。
  请从研报中提取评级、目标价、核心逻辑、盈利预测和风险提示。
  输出必须为标准 JSON。

user_prompt_template: |
  请总结 {stock_code} 最近 {limit} 篇券商研报的观点。

output_schema:
  rating_distribution:
    buy: int
    overweight: int
    neutral: int
    underweight: int
    sell: int
  target_price_range:
    min: float
    max: float
    median: float
  bullish_points: [str]
  bearish_points: [str]
  top_reports:
    - title: str
      broker: str
      rating: str
      target_price: float
      core_logic: str
      risk_warning: str

available_tools:
  - query_research_reports
  - read_pdf_from_minio
  - search_vector_kb
  - calculate_consensus
