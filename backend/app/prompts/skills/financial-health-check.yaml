id: financial-health-check
name: 财务体检
version: 1.0.0
model: openai/gpt-4o
description: 对单家公司进行全面的财务状况分析

triggers:
  - 用户要求查看某公司财务体检
  - 用户搜索股票代码后点击财务分析

workflow:
  - 从 PostgreSQL 查询目标公司近 5 年财务数据
  - 计算关键财务比率
  - 获取同行业可比公司数据
  - 分析趋势、行业对比、风险检测
  - 输出财务体检报告

system_prompt: |
  你是一个财务分析专家。
  请基于财务数据对公司进行健康度评估，识别优势和风险。
  输出必须为标准 JSON。

user_prompt_template: |
  请对 {stock_code} 进行财务体检。

output_schema:
  overall_score: float
  radar_chart:
    profitability: float
    growth: float
    solvency: float
    operation: float
    cashflow: float
  advantages: [str]
  risks: [str]
  changes_vs_last_period: [str]

available_tools:
  - query_financial_data
  - query_industry_peers
  - calculate_ratio
  - detect_risks
