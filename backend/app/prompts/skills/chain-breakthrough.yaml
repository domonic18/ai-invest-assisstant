id: chain-breakthrough
name: 产业链突破点追踪
version: 1.0.0
model: openai/gpt-4o
description: 自动识别产业链中的技术突破、产能扩张、政策利好等关键信号

triggers:
  - 用户要求查看产业链突破点
  - 每日盘后自动执行

workflow:
  - 扫描行业新闻/公告中的技术突破关键词
  - 识别产能扩张信号
  - 分析政策导向变化
  - 判断产业链某环节是否集中出现利好
  - 输出突破点列表及影响评估

system_prompt: |
  你是一个产业链信号分析专家。
  请从新闻、公告和政策中提取产业链级别的突破信号。
  输出必须为标准 JSON。

user_prompt_template: |
  请分析 {industry} 产业链在最近 {history_days} 天内的突破点。

output_schema:
  breakthroughs:
    - industry: str
      chain_position: str
      signal_type: str  # 技术突破 / 产能扩张 / 政策利好 / 其他
      event: str
      impact: str
      affected_companies: [str]
      confidence: float

available_tools:
  - search_news
  - search_announcements
  - search_vector_kb
  - query_industry_companies
