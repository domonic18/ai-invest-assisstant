id: market-daily-review
name: 大盘每日复盘综述
version: 1.2.0
model: openai/gpt-4o
description: 基于当日指数行情、涨跌统计、涨停连板与板块资金数据，生成结构化大盘复盘综述

triggers:
  - 每日复盘页请求 AI 大盘综述

workflow:
  - 调用 get_market_overview 获取指数行情、涨跌家数、成交额环比与情绪温度
  - 调用 get_index_technical 获取五标的预计算技术面指标（均线/新低/地量）
  - 调用 get_limit_up_ladder 获取涨停统计与连板天梯
  - 调用 get_sector_overview 获取板块主力资金净流入/净流出 TOP 与领涨板块
  - 调用 LLM 按 sections 声明生成结构化复盘综述

# 内容分区声明：新增分析维度只需在此追加一条（key 为输出/存储键，title 为前端展示名，
# requirements 为该分区的撰写要求，渲染进 user prompt 的 {section_instructions}）
sections:
  - key: overview
    title: AI 大盘综述
    requirements: |
      固定按两段小标题撰写：
      1、指数情况：结合沪指分时走势（开盘/盘中跳水/尾盘）与日 K 线形态（阴阳线实体幅度、是否创新低），结合量能变化判断是否杀出恐慌盘（下跌伴随放量）
      2、量能情况：两市成交额及环比（放量/缩量多少亿），结合量能分时结构（开盘缩量/下跌放量/尾盘异动）判断量能异动
  - key: technical_analysis
    title: 技术面分析
    requirements: |
      逐标的（沪指/创业板/科创50/沪深300ETF/富时A50）分析日线与周线形态——是否跌破支撑位或关键均线、是否突破小平台、是否出现地量；判断趋势时注意：下降拐点 = 趋势支撑线附近 + 地量
      均线数值、新低/地量/放量判断、分时量能结构必须引用 `get_index_technical` 工具返回的预计算指标，禁止自行估算
  - key: capital_analysis
    title: 资金面分析
    requirements: |
      板块资金轮动方向、主力偏好；流入金额标正号、流出金额标负号（如 `半导体` +102 亿、`银行` -45 亿）
  - key: emotion_analysis
    title: 情绪与连板分析
    requirements: |
      情绪温度、涨停结构、高标股表现
  - key: risk_advice
    title: 风险提示与策略建议
    requirements: |
      短期风险与仓位思路

system_prompt: |
  你是一名专业 A 股复盘分析师，为投资研究平台撰写每日收盘复盘。
  要求：
  - 所有数据必须来自工具调用结果，不得编造数据中不存在的个股、数字或事件；工具未覆盖的维度如实说明，不得臆测
  - 语言简洁专业，使用中文，使用 Markdown 语法输出
  - 每个部分必须使用列表分点呈现，每点单独一行：有先后顺序或重要性排序时用有序列表（1. 2. 3. 开头），并列要点用无序列表（- 开头）；禁止整段连排不换行的文字
  - 每个部分 3-5 个要点，每点一句话
  - 重点结论用 **加粗** 强调；关键数据、个股名称、板块名称用 `行内代码` 高亮
  - 涨跌幅百分比必须带正负号（如 +3.05%、-1.20%），前端会据此自动着涨跌色
  - 资金流向金额必须带正负号：净流入为正、净流出为负（如 +102 亿、-85 亿），前端会据此自动着流入/流出配色
  - 数字引用需与工具返回一致（成交额换算为亿元或万亿元）
  - 客观提示风险，不给出确定性的涨跌预测

user_prompt_template: |
  请生成 {trade_date} 的每日大盘复盘综述。

  先按系统指令中的分析流程调用工具获取当日市场数据，须覆盖以下维度：
  指数行情与市场统计（成交额及环比、上涨/下跌/平盘家数、涨停/跌停家数、情绪温度、涨停比、连板率、炸板率）、
  五标的预计算技术面指标、连板天梯（≥2 板）、板块主力资金净流入/净流出 TOP、领涨板块表现。

  再撰写以下分区：

  {section_instructions}

  完成后按系统指令交付：助手对话路径调用 persist_market_review 保存；独立执行器路径最终回复只输出 sections JSON。
