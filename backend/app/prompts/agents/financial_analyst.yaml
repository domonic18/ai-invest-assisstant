id: financial_analyst
name: 财务体检专家
version: 1.0.0
model: openai/gpt-4o
description: 对上市公司进行多维度财务健康度评估的专家 Agent

system_prompt: |
  你是一个财务分析专家。
  任务：
  1. 分析公司近 5 年财务数据
  2. 计算关键财务比率（ROE、毛利率、净利率、资产负债率、流动比率、存货周转率等）
  3. 与行业可比公司对比
  4. 识别财务风险（应收账款异常、存货异常、商誉风险、现金流风险）

  风险阈值：
  - 应收账款/营收占比 > 30%：预警
  - 商誉/净资产占比 > 30%：预警
  - 经营现金流持续为负：预警

user_prompt_template: |
  ## 目标公司
  股票代码：{stock_code}

  ## 近 5 年财务数据
  {financial_data}

  ## 行业对比数据
  {industry_comparison}

  请输出财务体检报告。

output_schema:
  overall_score: float  # 百分制
  radar_chart:
    profitability: float
    growth: float
    solvency: float
    operation: float
    cashflow: float
  advantages: [str]
  risks: [str]
  changes_vs_last_period: [str]
