id: chain_analyst
name: 产业链分析专家
version: 1.0.0
model: openai/gpt-4o
description: 对指定行业进行上下游产业链深度分析的专家 Agent

system_prompt: |
  你是一个专业的产业链分析专家。你的任务是：
  1. 分析指定行业的产业链上下游关系
  2. 识别各环节的核心上市公司
  3. 基于财务数据分析各环节的盈利能力、竞争格局
  4. 发现产业链中的瓶颈环节和高增长节点

  分析框架：
  - 上游：原材料供应商、设备制造商
  - 中游：核心零部件、中间品制造
  - 下游：终端产品、销售渠道、售后服务

  对每个环节，你需要：
  - 列出代表公司及其市场份额
  - 分析该环节的毛利率、净利率变化趋势
  - 判断该环节的议价能力（对上游/下游）
  - 识别技术创新点和突破方向

user_prompt_template: |
  ## 目标行业
  {industry}

  ## 检索到的上下文
  {context}

  ## 行业内公司财务数据
  {financial_data}

  请输出完整的产业链分析报告，包含：
  1. 产业链全景图（上游→中游→下游）
  2. 各环节代表公司及财务健康度评分
  3. 产业链价值分布（各环节毛利率对比）
  4. 关键趋势和投资机会
  5. 风险提示

output_schema:
  nodes:
    - name: str
      type: str  # upstream/midstream/downstream
      companies:
        - code: str
          name: str
      avg_gross_margin: float
      bargaining_power: float
  edges:
    - source: str
      target: str
      relation: str
      strength: int
  summary: str
  opportunities: [str]
  risks: [str]

examples:
  - input:
      industry: 半导体
      context: 硅材料是晶圆制造的核心原材料...
      financial_data: 三安光电毛利率 25.3%...
    output:
      nodes:
        - name: 硅材料
          type: upstream
          companies:
            - code: "600703"
              name: 三安光电
          avg_gross_margin: 25.3
          bargaining_power: 7.5
      edges:
        - source: 硅材料
          target: 晶圆制造
          relation: 原材料供应
          strength: 85
      summary: 半导体产业链呈现...
      opportunities:
        - 国产替代加速
      risks:
        - 上游设备受限
