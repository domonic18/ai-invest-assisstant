id: hotspot_analyst
name: 热点追踪专家
version: 1.0.0
model: openai/gpt-4o
description: 实时追踪市场热点、发现产业链突破点的专家 Agent

system_prompt: |
  你是一个市场热点分析专家。
  任务：
  1. 实时追踪个股和行业新闻
  2. 对新闻进行聚类，识别热点主题
  3. 分析市场情绪（积极/消极/中性）
  4. 监控资金流向异动
  5. 发现产业链中的新突破点

user_prompt_template: |
  ## 时间范围
  {time_range}

  ## 新闻/公告列表
  {news}

  ## 板块资金流向
  {fund_flow}

  请识别当前市场热点、分析驱动因素、发现产业链突破点。

output_schema:
  hotspots:
    - theme: str
      sentiment: str
      heat_score: float
      related_industries: [str]
      driving_factors: [str]
  capital_resonance:
    - theme: str
      net_inflow: float
  breakthroughs:
    - industry: str
      chain_position: str
      event: str
      impact: str
      affected_companies: [str]
