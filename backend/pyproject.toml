[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-invest-assistant-backend"
version = "0.1.0"
description = "AI Investment Assistant - Backend API and Agent Services"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AI Invest Assistant Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Framework :: SQLAlchemy",
]

dependencies = [
    # Web Framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Cache & Queue
    "redis>=5.0.0",
    "celery>=5.4.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # AI Agent
    "pydantic-ai>=0.0.10",
    "openai>=1.35.0",
    "anthropic>=0.28.0",

    # MCP
    "mcp>=1.0.0",

    # Search & Vector
    "elasticsearch[async]>=8.13.0",
    "pymilvus>=2.4.0",

    # Storage
    "minio>=7.2.0",

    # Data & Finance
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2.0",
    "akshare>=1.14.0",

    # Web Scraping
    "scrapy>=2.11.0",
    "playwright>=1.44.0",
    "httpx>=0.27.0",

    # Utils
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.9.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",

    # WeChat Mini Program auth (optional)
    "itsdangerous>=2.2.0",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "aiosqlite>=0.20.0",

    # Linting & Formatting
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",

    # Type stubs
    "types-pyyaml",
    "types-python-jose",
    "types-passlib",

    # Development
    "ipython>=8.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = [
    "app.agent.*",
]
disallow_untyped_defs = false
warn_return_any = false

[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "collector*"]

[project.scripts]
ai-invest-api = "app.main:app"
