[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
markers =
    unit: 单元测试，无外部依赖，快速执行
    integration: 集成测试，需要数据库/Redis/ES等中间件
    database: 数据库测试
    collector: 采集器测试
    api: API 接口测试
    mcp: MCP 接口测试

filterwarnings =
    ignore::DeprecationWarning

[tool:pytest]
addopts = -v --tb=short
