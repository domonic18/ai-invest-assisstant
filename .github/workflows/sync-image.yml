name: Sync Third-party Image / 第三方镜像同步 TCR

# 第三方公共镜像入 TCR：registry 直拷（buildx imagetools create），
# 不落本地盘、不受构建机 CPU 架构影响，保留源镜像完整多架构 manifest。
# （教训：在 arm64 Mac 上 pull+tag+push 单平台镜像会推成 arm64，
#   amd64 服务器拉起即 exec format error，2026-10-16 caddy 踩坑）
# 服务器境内直连 docker hub 不可靠、仅从 TCR 拉取，故第三方镜像须经此入库。
# 低频手动操作：workflow_dispatch 触发。

on:
  workflow_dispatch:
    inputs:
      source:
        description: '源镜像引用（如 library/caddy:2）'
        required: true
        default: 'library/caddy:2'
      target:
        description: 'TCR 目标引用（REGISTRY/domonic18/ 之后的部分，如 caddy:2）'
        required: true
        default: 'caddy:2'

env:
  REGISTRY: ccr.ccs.tencentyun.com

jobs:
  sync:
    runs-on: [self-hosted, macOS]
    steps:
      - name: Login to TCR / 登录腾讯云容器镜像服务
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      # 持久 builder：docker.io 拉取走国内镜像源（~/Workspace/actions-runner/buildkitd.toml）
      - name: Select builder / 选择持久 builder
        run: docker buildx use ci-builder

      - name: Sync image / registry 直拷入 TCR
        run: |
          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/domonic18/${{ inputs.target }}" \
            "${{ inputs.source }}"

      - name: Verify / 校验目标 manifest
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/domonic18/${{ inputs.target }}"
