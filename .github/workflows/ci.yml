name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      skip_lint:
        description: '跳过代码检查阶段'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_test:
        description: '跳过单元测试阶段'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  # 强制 GitHub Actions 使用 Node.js 24 runtime（actions/checkout, actions/setup-node 等）
  # 解决 "Node.js 20 actions are deprecated" 弃用警告
  # 参考: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_VERSION: '22'
  REGISTRY: ccr.ccs.tencentyun.com
  NAMESPACE: ${{ secrets.TCR_NAMESPACE }}

jobs:
  # ============================================================
  # Stage 1: 后端代码检查与测试
  # ============================================================
  backend:
    name: Backend / 后端
    runs-on: ubuntu-latest

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      # Dockerfile 静态检查放美国 runner（hadolint 无 darwin-arm64 原生版，构建机为 macOS）
      - name: Dockerfile Lint / Dockerfile 检查（web）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/web/Dockerfile
          failure-threshold: error

      - name: Dockerfile Lint / Dockerfile 检查（collector）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/collector/Dockerfile
          failure-threshold: error

      - name: Dockerfile Lint / Dockerfile 检查（signer）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/signer/Dockerfile
          failure-threshold: error

      - name: Dockerfile Lint / Dockerfile 检查（paper-trade）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/paper-trade/Dockerfile
          failure-threshold: error

      - name: Install uv / 安装 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python / 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Sync Dependencies / 同步依赖
        working-directory: backend
        run: uv sync --frozen

      - name: Lint / 代码检查
        if: github.event.inputs.skip_lint != 'true'
        working-directory: backend
        run: uv run ruff check .

      - name: Type Check / 类型检查
        working-directory: backend
        run: uv run mypy app/

      - name: Test / 运行测试
        if: github.event.inputs.skip_test != 'true'
        working-directory: backend
        run: uv run pytest -m unit --cov=app --cov-report=xml

  # ============================================================
  # Stage 2: 前端代码检查与构建
  # ============================================================
  web:
    name: Web / 前端
    runs-on: ubuntu-latest

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      - name: Setup Node.js / 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            web/package-lock.json

      - name: Build shared package / 构建共享包
        working-directory: shared
        run: |
          npm ci
          npm run build

      - name: Install Dependencies / 安装依赖
        working-directory: web
        run: npm ci

      - name: Generate app version / 生成应用版本号
        id: version
        run: |
          APP_VERSION=$(cat VERSION)
          echo "app_version=${APP_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Lint / 代码检查
        if: github.event.inputs.skip_lint != 'true'
        working-directory: web
        run: npm run lint

      - name: Type Check / 类型检查
        working-directory: web
        run: npm run typecheck

      - name: Test / 运行测试
        if: github.event.inputs.skip_test != 'true'
        working-directory: web
        run: npm run test:unit

      - name: Build / 构建
        working-directory: web
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: npm run build

  # ============================================================
  # Stage 2.5: 数据库迁移守卫——空库从零重放全部迁移 + 幂等重放断言。
  # migrations/ 是 schema 单一真相源（CLAUDE.md「数据库迁移规范」）；
  # 手动脚本制下无应用启动兜底，此 job 是 baseline 与增量漂移的唯一自动防线
  # ============================================================
  db-migration-guard:
    name: DB Migration / 从零迁移守卫
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: invest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d invest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      - name: Apply all migrations / 从零应用全部迁移
        run: bash docker/database/migrate.sh

      - name: Assert schema / 断言基线表与种子齐全
        run: |
          table_count="$(psql -qAt -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")"
          echo "public tables: $table_count"
          [ "$table_count" -ge 80 ] || { echo "ERROR: 基线表数量异常（预期 ≥80）" >&2; exit 1; }
          seed_rows="$(psql -qAt -c "SELECT count(*) FROM collector_task")"
          echo "collector_task rows: $seed_rows"
          [ "$seed_rows" -ge 1 ] || { echo "ERROR: seed 未生效（collector_task 为空）" >&2; exit 1; }

      - name: Replay idempotency / 幂等重放（应全量跳过）
        run: |
          out="$(bash docker/database/migrate.sh)"
          echo "$out"
          grep -q "applied=0" <<<"$out" || { echo "ERROR: 重放产生了新 applied，迁移不幂等" >&2; exit 1; }

  # ============================================================
  # Stage 3: Docker 镜像构建与推送（四镜像并行 job，互不拖累）
  # 构建机为自托管 runner（Mac，本机直推 TCR 国内链路，无跨境 stall）；
  # 构建与推送分离保留：build 失败可秒级重跑，push 走简单两连推
  # ============================================================
  docker-web:
    name: Docker Web / Web 镜像构建推送
    runs-on: [self-hosted]
    needs: [backend, web]
    # push 到 develop/main 自动构建；workflow_dispatch 供首次打通 TCR 时手动触发
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      # 本机持久 builder（buildkitd 配国内 docker.io 镜像源 + 本地缓存跨 job 持久，见 ~/actions-runner/buildkitd.toml）
      - name: Select builder / 选择构建器
        run: docker buildx use ci-builder

      - name: Login to TCR / 登录腾讯云容器镜像服务
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Resolve tags / 解析标签
        id: vars
        run: |
          {
            echo "sha_short=$(git rev-parse --short HEAD)"
            echo "branch=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')"
            echo "app_version=$(cat VERSION).${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image / 本地构建镜像（buildx 本地缓存）
        # 只构建不入库：load 进本地 docker，buildx 本地缓存保留，失败重跑秒级复用
        uses: docker/build-push-action@v7
        timeout-minutes: 20
        with:
          context: .
          file: docker/web/Dockerfile
          push: false
          load: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/web:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/web:latest
          build-args: |
            VITE_APP_VERSION=${{ steps.vars.outputs.app_version }}
      - name: Push to TCR / 推送镜像
        # 构建机直推国内 TCR，链路稳定；失败直接重跑 job（macOS 无 GNU timeout，跨境期重型重试已去）
        timeout-minutes: 15
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/web
          VERSION_TAG: ${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
        run: |
          set -eu
          docker push "$IMAGE:$VERSION_TAG"
          docker push "$IMAGE:latest"

  docker-collector:
    name: Docker Collector / 采集镜像构建推送
    runs-on: [self-hosted]
    needs: [backend, web]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      # 本机持久 builder（buildkitd 配国内 docker.io 镜像源 + 本地缓存跨 job 持久，见 ~/actions-runner/buildkitd.toml）
      - name: Select builder / 选择构建器
        run: docker buildx use ci-builder

      - name: Login to TCR / 登录腾讯云容器镜像服务
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Resolve tags / 解析标签
        id: vars
        run: |
          {
            echo "sha_short=$(git rev-parse --short HEAD)"
            echo "branch=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')"
          } >> "$GITHUB_OUTPUT"

      - name: Build image / 本地构建镜像（buildx 本地缓存）
        # 只构建不入库：load 进本地 docker，buildx 本地缓存保留，失败重跑秒级复用
        uses: docker/build-push-action@v7
        timeout-minutes: 20
        with:
          context: .
          file: docker/collector/Dockerfile
          push: false
          load: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/collector:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/collector:latest
      - name: Push to TCR / 推送镜像
        # 构建机直推国内 TCR，链路稳定；失败直接重跑 job（macOS 无 GNU timeout，跨境期重型重试已去）
        timeout-minutes: 15
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/collector
          VERSION_TAG: ${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
        run: |
          set -eu
          docker push "$IMAGE:$VERSION_TAG"
          docker push "$IMAGE:latest"

  # ============================================================
  # Stage 4: 抖音签名 sidecar 镜像（F-SOC；无 ENTRYPOINT；镜像固定 amd64）
  # ============================================================
  docker-signer:
    name: Docker Signer / 签名镜像构建推送
    runs-on: [self-hosted]
    needs: [backend, web]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      # 本机持久 builder（buildkitd 配国内 docker.io 镜像源 + 本地缓存跨 job 持久，见 ~/actions-runner/buildkitd.toml）
      - name: Select builder / 选择构建器
        run: docker buildx use ci-builder

      - name: Login to TCR / 登录腾讯云容器镜像服务
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Resolve tags / 解析标签
        id: vars
        run: |
          {
            echo "sha_short=$(git rev-parse --short HEAD)"
            echo "branch=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')"
          } >> "$GITHUB_OUTPUT"

      - name: Build image / 本地构建镜像（buildx 本地缓存）
        # 只构建不入库：load 进本地 docker，buildx 本地缓存保留，失败重跑秒级复用
        uses: docker/build-push-action@v7
        timeout-minutes: 20
        with:
          context: .
          file: docker/signer/Dockerfile
          push: false
          load: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/douyin-signer:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/douyin-signer:latest
          # playwright 浏览器二进制无国内镜像，经宿主机代理拉取（Docker 预定义 ARG，无需 Dockerfile 声明；
          # 与本地构建同法，代理离线时此步失败属预期）
          build-args: |
            HTTPS_PROXY=http://host.docker.internal:7897
            HTTP_PROXY=http://host.docker.internal:7897
            NO_PROXY=localhost,127.0.0.1,host.docker.internal,mirrors.tuna.tsinghua.edu.cn,pypi.tuna.tsinghua.edu.cn
      - name: Push to TCR / 推送镜像
        # 构建机直推国内 TCR，链路稳定；失败直接重跑 job（macOS 无 GNU timeout，跨境期重型重试已去）
        timeout-minutes: 15
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/douyin-signer
          VERSION_TAG: ${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
        run: |
          set -eu
          docker push "$IMAGE:$VERSION_TAG"
          docker push "$IMAGE:latest"

  # ============================================================
  # Stage 5: 模拟盘柜台 sidecar 镜像（掘金 REST 网关；纯 Python，
  # build context 与 compose 一致取 docker/paper-trade 目录；镜像固定 amd64）
  # ============================================================
  docker-paper-trade:
    name: Docker Paper Trade / 模拟盘镜像构建推送
    runs-on: [self-hosted]
    needs: [backend, web]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      # 本机持久 builder（buildkitd 配国内 docker.io 镜像源 + 本地缓存跨 job 持久，见 ~/actions-runner/buildkitd.toml）
      - name: Select builder / 选择构建器
        run: docker buildx use ci-builder

      - name: Login to TCR / 登录腾讯云容器镜像服务
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Resolve tags / 解析标签
        id: vars
        run: |
          {
            echo "sha_short=$(git rev-parse --short HEAD)"
            echo "branch=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')"
          } >> "$GITHUB_OUTPUT"

      - name: Build image / 本地构建镜像（buildx 本地缓存）
        # 只构建不入库：load 进本地 docker，buildx 本地缓存保留，失败重跑秒级复用
        uses: docker/build-push-action@v7
        timeout-minutes: 20
        with:
          context: docker/paper-trade
          file: docker/paper-trade/Dockerfile
          push: false
          load: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/paper-trade:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/paper-trade:latest
      - name: Push to TCR / 推送镜像
        # 构建机直推国内 TCR，链路稳定；失败直接重跑 job（macOS 无 GNU timeout，跨境期重型重试已去）
        timeout-minutes: 15
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/paper-trade
          VERSION_TAG: ${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
        run: |
          set -eu
          docker push "$IMAGE:$VERSION_TAG"
          docker push "$IMAGE:latest"
