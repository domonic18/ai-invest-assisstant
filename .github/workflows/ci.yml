              else
                echo "推送失败（exit=$?）：$IMAGE:$tag"
                failed=1
              fi
              echo "::endgroup::"
            done
            if [ "$failed" -eq 0 ]; then
              exit 0
            fi
            attempt=$((attempt + 1))
            if [ "$attempt" -le 3 ]; then
              sleep 10
            fi
          done
          echo "::error::跨境推送 3 轮均失败：$IMAGE"
          exit 1
