name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sync dependencies
        run: cd backend && uv sync
      - name: Run tests
        run: cd backend && uv run pytest -m unit --cov=app --cov-report=xml

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd web && npm install
      - run: cd web && npm run lint
      - run: cd web && npm run typecheck
      - run: cd web && npm run test:unit -- --coverage

  build-images:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: [backend-test, web-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t web-api:latest -f docker/web/Dockerfile .
      - run: docker build -t collector:latest -f docker/collector/Dockerfile .
