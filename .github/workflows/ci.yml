                failed=1
              fi
              echo "::endgroup::"
            done
            if [ "$failed" -eq 0 ]; then
              exit 0
            fi
            attempt=$((attempt + 1))
            if [ "$attempt" -le 3 ]; then
              sleep 10
            fi
          done
          echo "::error::跨境推送 3 轮均失败：$IMAGE"
          exit 1

  # ============================================================
  # Stage 5: 模拟盘柜台 sidecar 镜像（掘金 REST 网关；纯 Python 无平台限制，
  # build context 与 compose 一致取 docker/paper-trade 目录）
  # ============================================================
  docker-paper-trade:
    name: Docker Paper Trade / 模拟盘镜像构建推送
    runs-on: ubuntu-latest
    needs: [backend, web]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      - name: Dockerfile Lint / Dockerfile 检查
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/paper-trade/Dockerfile
          failure-threshold: error

      - name: Set up Docker Buildx / 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to TCR / 登录腾讯云容器镜像服务
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Resolve tags / 解析标签
        id: vars
        run: |
          {
            echo "sha_short=$(git rev-parse --short HEAD)"
            echo "branch=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')"
          } >> "$GITHUB_OUTPUT"

      - name: Build image / 本地构建镜像（GHA 缓存加速）
        # 只构建不入库：load 进本地 docker，GHA cache 保留，推送失败时秒级复用
        uses: docker/build-push-action@v7
        timeout-minutes: 20
        with:
          context: docker/paper-trade
          file: docker/paper-trade/Dockerfile
          push: false
          load: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/paper-trade:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/paper-trade:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push to TCR / 跨境断点续推（最多 3 轮，单轮硬超时）
        # 已上传的层被 registry 判 Layer already exists 跳过，轮次间与 re-run 间均续传；
        # 预算 = 3 轮 × 2 tag × 600s + 间隔 < 步骤上限，脚本自身先于步骤超时收口
        timeout-minutes: 70
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/paper-trade
          VERSION_TAG: ${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
        run: |
          set -u
          attempt=1
          while [ "$attempt" -le 3 ]; do
            failed=0
            for tag in "$VERSION_TAG" latest; do
