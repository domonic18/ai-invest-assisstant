name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      skip_lint:
        description: '跳过代码检查阶段'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_test:
        description: '跳过单元测试阶段'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  # 强制 GitHub Actions 使用 Node.js 24 runtime（actions/checkout, actions/setup-node 等）
  # 解决 "Node.js 20 actions are deprecated" 弃用警告
  # 参考: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_VERSION: '22'
  REGISTRY: ccr.ccs.tencentyun.com
  NAMESPACE: ${{ secrets.TCR_NAMESPACE }}

jobs:
  # ============================================================
  # Stage 1: 后端代码检查与测试
  # ============================================================
  backend:
    name: Backend / 后端
    runs-on: ubuntu-latest

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      # Dockerfile 静态检查放美国 runner（hadolint 无 darwin-arm64 原生版，构建机为 macOS）
      - name: Dockerfile Lint / Dockerfile 检查（web）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/web/Dockerfile
          failure-threshold: error

      - name: Dockerfile Lint / Dockerfile 检查（collector）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/collector/Dockerfile
          failure-threshold: error

      - name: Dockerfile Lint / Dockerfile 检查（signer）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/signer/Dockerfile
          failure-threshold: error

      - name: Dockerfile Lint / Dockerfile 检查（paper-trade）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/paper-trade/Dockerfile
          failure-threshold: error

      - name: Install uv / 安装 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python / 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Sync Dependencies / 同步依赖
        working-directory: backend
        run: uv sync --frozen

      - name: Lint / 代码检查
        if: github.event.inputs.skip_lint != 'true'
        working-directory: backend
        run: uv run ruff check .

      - name: Type Check / 类型检查
        working-directory: backend
        run: uv run mypy app/

      - name: Test / 运行测试
        if: github.event.inputs.skip_test != 'true'
        working-directory: backend
        run: uv run pytest -m unit --cov=app --cov-report=xml

  # ============================================================
  # Stage 2: 前端代码检查与构建
  # ============================================================
  web:
    name: Web / 前端
    runs-on: ubuntu-latest

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      - name: Setup Node.js / 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            web/package-lock.json

      - name: Build shared package / 构建共享包
        working-directory: shared
        run: |
          npm ci
          npm run build

      - name: Install Dependencies / 安装依赖
        working-directory: web
        run: npm ci

      - name: Generate app version / 生成应用版本号
        id: version
        run: |
          APP_VERSION=$(cat VERSION)
          echo "app_version=${APP_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Lint / 代码检查
        if: github.event.inputs.skip_lint != 'true'
        working-directory: web
        run: npm run lint

      - name: Type Check / 类型检查
        working-directory: web
        run: npm run typecheck

      - name: Test / 运行测试
        if: github.event.inputs.skip_test != 'true'
        working-directory: web
        run: npm run test:unit

      - name: Build / 构建
        working-directory: web
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: npm run build

  # ============================================================
  # Stage 2.5: 数据库迁移守卫——空库从零重放全部迁移 + 幂等重放断言。
  # migrations/ 是 schema 单一真相源（CLAUDE.md「数据库迁移规范」）；
  # 手动脚本制下无应用启动兜底，此 job 是 baseline 与增量漂移的唯一自动防线
  # ============================================================
  db-migration-guard:
    name: DB Migration / 从零迁移守卫
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: invest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d invest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      - name: Static idempotency check / 迁移幂等性静态检查
        run: python3 scripts/check_migration_idempotency.py

      - name: Apply all migrations / 从零应用全部迁移
        run: bash docker/database/migrate.sh

      - name: Assert schema / 断言基线表与种子齐全
        run: |
          table_count="$(psql -qAt -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")"
          echo "public tables: $table_count"
          [ "$table_count" -ge 80 ] || { echo "ERROR: 基线表数量异常（预期 ≥80）" >&2; exit 1; }
          seed_rows="$(psql -qAt -c "SELECT count(*) FROM collector_task")"
          echo "collector_task rows: $seed_rows"
          [ "$seed_rows" -ge 1 ] || { echo "ERROR: seed 未生效（collector_task 为空）" >&2; exit 1; }

      - name: Replay idempotency / 幂等重放（应全量跳过）
        run: |
          out="$(bash docker/database/migrate.sh)"
          echo "$out"
          grep -q "applied=0" <<<"$out" || { echo "ERROR: 重放产生了新 applied，迁移不幂等" >&2; exit 1; }

  # ============================================================
  # Stage 2.6: 数据库增量迁移守卫——从「线上 schema」出发验证增量路径，
  # 并断言增量结果与从零重放的结果一致（无 schema 漂移）。
  # db-migration-guard 只覆盖空库从零重放；真实的「线上 schema → 新 schema」
  # 增量路径此前从未被自动验证过——生产迁移事故正是从这条路径漏出来的。
  # ============================================================
  db-incremental-guard:
    name: DB Migration / 增量迁移守卫（线上 schema → 新 schema）
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d invest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract base migrations / 抽出主干迁移（线上 schema 基准）
        run: |
          # 基准 = origin/main 的迁移集：生产当前跑的 schema 即由此重放而来
          git fetch --no-tags origin main
          mkdir -p base
          git archive origin/main docker/database/migrations | tar -x -C base
          find base/docker/database/migrations -maxdepth 1 -name '*.sql' | head -n 5
          echo "base migrations: $(find base/docker/database/migrations -maxdepth 1 -name '*.sql' | wc -l)"

      - name: Apply base migrations to prod schema / 在 prod_schema 上应用主干迁移
        env:
          PGDATABASE: prod_schema
        run: |
          psql -d postgres -c "CREATE DATABASE prod_schema"
          MIGRATIONS_DIR=base/docker/database/migrations bash docker/database/migrate.sh

      - name: Apply incremental migrations / 在 prod_schema 上增量应用本次迁移
        env:
          PGDATABASE: prod_schema
        run: bash docker/database/migrate.sh

      - name: Apply all migrations from zero / 从零重放全部迁移到 fresh_schema
        env:
          PGDATABASE: fresh_schema
        run: |
          psql -d postgres -c "CREATE DATABASE fresh_schema"
          bash docker/database/migrate.sh

      - name: Assert no schema drift / 断言增量与从零结果一致
        run: |
          # 比对对象：列、索引、约束清单（不比数据、不比 pg_dump 文本，避免格式噪声误报）
          for db in prod_schema fresh_schema; do
            psql -d "$db" -qAt -c "
              SELECT table_name||'.'||column_name||':'||data_type||':'||is_nullable
              FROM information_schema.columns WHERE table_schema='public' ORDER BY 1" > "/tmp/cols.$db"
            psql -d "$db" -qAt -c "
              SELECT tablename||'.'||indexname FROM pg_indexes WHERE schemaname='public' ORDER BY 1" > "/tmp/idx.$db"
            psql -d "$db" -qAt -c "
              SELECT conrelid::regclass::text||'.'||conname||':'||contype::text
              FROM pg_constraint WHERE connamespace='public'::regnamespace ORDER BY 1" > "/tmp/con.$db"
          done
          failed=0
          for kind in cols idx con; do
            if ! diff -u "/tmp/$kind.prod_schema" "/tmp/$kind.fresh_schema"; then
              echo "ERROR: $kind 漂移：增量路径与从零路径结果不一致" >&2
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "schema 一致：列/索引/约束三清单在增量与从零路径下完全相同"

  # ============================================================
  # Stage 3: Docker 镜像构建与推送（四镜像并行 job，互不拖累）
  # 构建机为自托管 runner（Mac，本机直推 TCR 国内链路，无跨境 stall）；
  # 构建与推送分离保留：build 失败可秒级重跑，push 走简单两连推
  # ============================================================
  docker-web:
    name: Docker Web / Web 镜像构建推送
    runs-on: [self-hosted]
    needs: [backend, web, db-migration-guard, db-incremental-guard]
    # push 到 develop/main 自动构建；workflow_dispatch 供首次打通 TCR 时手动触发
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      # 本机持久 builder（buildkitd 配国内 docker.io 镜像源 + 本地缓存跨 job 持久，见 ~/Workspace/actions-runner/buildkitd.toml）
      - name: Select builder / 选择构建器
        run: docker buildx use ci-builder

      - name: Login to TCR / 登录腾讯云容器镜像服务
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Resolve tags / 解析标签
        id: vars
        run: |
          {
            echo "sha_short=$(git rev-parse --short=7 "$GITHUB_SHA")"
            echo "branch=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')"
            echo "app_version=$(cat VERSION).${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image / 本地构建镜像（buildx 本地缓存）
        # 只构建不入库：load 进本地 docker，buildx 本地缓存保留，失败重跑秒级复用
        uses: docker/build-push-action@v7
        timeout-minutes: 20
        with:
          context: .
          file: docker/web/Dockerfile
          push: false
          load: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/web:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
          build-args: |
            VITE_APP_VERSION=${{ steps.vars.outputs.app_version }}
      - name: Push to TCR / 推送镜像
        # 构建机直推国内 TCR，链路稳定；失败直接重跑 job（macOS 无 GNU timeout，跨境期重型重试已去）
        timeout-minutes: 15
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/web
          VERSION_TAG: ${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
        run: |
          set -eu
          docker push "$IMAGE:$VERSION_TAG"

  docker-collector:
    name: Docker Collector / 采集镜像构建推送
    runs-on: [self-hosted]
    needs: [backend, web, db-migration-guard, db-incremental-guard]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      # 本机持久 builder（buildkitd 配国内 docker.io 镜像源 + 本地缓存跨 job 持久，见 ~/Workspace/actions-runner/buildkitd.toml）
      - name: Select builder / 选择构建器
        run: docker buildx use ci-builder

      - name: Login to TCR / 登录腾讯云容器镜像服务
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Resolve tags / 解析标签
        id: vars
        run: |
          {
            echo "sha_short=$(git rev-parse --short=7 "$GITHUB_SHA")"
            echo "branch=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')"
          } >> "$GITHUB_OUTPUT"

      - name: Build image / 本地构建镜像（buildx 本地缓存）
        # 只构建不入库：load 进本地 docker，buildx 本地缓存保留，失败重跑秒级复用
        uses: docker/build-push-action@v7
        timeout-minutes: 20
        with:
          context: .
          file: docker/collector/Dockerfile
          push: false
          load: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/collector:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
      - name: Push to TCR / 推送镜像
        # 构建机直推国内 TCR，链路稳定；失败直接重跑 job（macOS 无 GNU timeout，跨境期重型重试已去）
        timeout-minutes: 15
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/collector
          VERSION_TAG: ${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
        run: |
          set -eu
          docker push "$IMAGE:$VERSION_TAG"

  # ============================================================
  # Stage 4: 抖音签名 sidecar 镜像（F-SOC；无 ENTRYPOINT；镜像固定 amd64）
  # ============================================================
  docker-signer:
    name: Docker Signer / 签名镜像构建推送
    runs-on: [self-hosted]
    needs: [backend, web, db-migration-guard, db-incremental-guard]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      # 本机持久 builder（buildkitd 配国内 docker.io 镜像源 + 本地缓存跨 job 持久，见 ~/Workspace/actions-runner/buildkitd.toml）
      - name: Select builder / 选择构建器
        run: docker buildx use ci-builder

      - name: Login to TCR / 登录腾讯云容器镜像服务
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Resolve tags / 解析标签
        id: vars
        run: |
          {
            echo "sha_short=$(git rev-parse --short=7 "$GITHUB_SHA")"
            echo "branch=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')"
          } >> "$GITHUB_OUTPUT"

      - name: Build image / 本地构建镜像（buildx 本地缓存）
        # 只构建不入库：load 进本地 docker，buildx 本地缓存保留，失败重跑秒级复用
        uses: docker/build-push-action@v7
        timeout-minutes: 20
        with:
          context: .
          file: docker/signer/Dockerfile
          push: false
          load: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/douyin-signer:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
          # playwright 浏览器二进制无国内镜像，经宿主机代理拉取（Docker 预定义 ARG，无需 Dockerfile 声明；
          # 与本地构建同法，代理离线时此步失败属预期）
          build-args: |
            HTTPS_PROXY=http://host.docker.internal:7897
            HTTP_PROXY=http://host.docker.internal:7897
            NO_PROXY=localhost,127.0.0.1,host.docker.internal,mirrors.tuna.tsinghua.edu.cn,pypi.tuna.tsinghua.edu.cn
      - name: Push to TCR / 推送镜像
        # 构建机直推国内 TCR，链路稳定；失败直接重跑 job（macOS 无 GNU timeout，跨境期重型重试已去）
        timeout-minutes: 15
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/douyin-signer
          VERSION_TAG: ${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
        run: |
          set -eu
          docker push "$IMAGE:$VERSION_TAG"

  # ============================================================
  # Stage 5: 模拟盘柜台 sidecar 镜像（掘金 REST 网关；纯 Python，
  # build context 与 compose 一致取 docker/paper-trade 目录；镜像固定 amd64）
  # ============================================================
  docker-paper-trade:
    name: Docker Paper Trade / 模拟盘镜像构建推送
    runs-on: [self-hosted]
    needs: [backend, web, db-migration-guard, db-incremental-guard]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      # 本机持久 builder（buildkitd 配国内 docker.io 镜像源 + 本地缓存跨 job 持久，见 ~/Workspace/actions-runner/buildkitd.toml）
      - name: Select builder / 选择构建器
        run: docker buildx use ci-builder

      - name: Login to TCR / 登录腾讯云容器镜像服务
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Resolve tags / 解析标签
        id: vars
        run: |
          {
            echo "sha_short=$(git rev-parse --short=7 "$GITHUB_SHA")"
            echo "branch=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')"
          } >> "$GITHUB_OUTPUT"

      - name: Build image / 本地构建镜像（buildx 本地缓存）
        # 只构建不入库：load 进本地 docker，buildx 本地缓存保留，失败重跑秒级复用
        uses: docker/build-push-action@v7
        timeout-minutes: 20
        with:
          context: docker/paper-trade
          file: docker/paper-trade/Dockerfile
          push: false
          load: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/paper-trade:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
      - name: Push to TCR / 推送镜像
        # 构建机直推国内 TCR，链路稳定；失败直接重跑 job（macOS 无 GNU timeout，跨境期重型重试已去）
        timeout-minutes: 15
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/paper-trade
          VERSION_TAG: ${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
        run: |
          set -eu
          docker push "$IMAGE:$VERSION_TAG"

  # ============================================================
  # Stage 6: 本机测试环境自动更新（合并 develop 即生效）
  # 目标机 = 本机项目目录：compose 与 .env 常驻此处，应用代码全在 TCR 镜像里，
  # 故只需把部署脚本、compose 文件与迁移文件同步过去再调 deploy.sh。
  # ============================================================
  deploy-staging:
    name: Deploy Staging / 本机测试环境更新
    runs-on: [self-hosted]
    needs: [docker-web, docker-collector, docker-signer, docker-paper-trade]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    timeout-minutes: 30
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      DEPLOY_ROOT: /Users/deadwalk/Code/ai-invest-assisstant

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      - name: Login to TCR / 登录腾讯云容器镜像服务
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Resolve tag / 解析镜像标签（与 docker-* job 同规则）
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Sync deploy assets / 同步部署脚本、compose 与迁移
        run: |
          set -eu
          root="$DEPLOY_ROOT"
          [ -f "$root/.env" ] || { echo "ERROR: $root/.env 不存在，先准备测试环境配置" >&2; exit 1; }
          mkdir -p "$root/scripts"
          cp scripts/deploy.sh "$root/scripts/deploy.sh"
          chmod 755 "$root/scripts/deploy.sh"
          cp docker-compose.yml docker-compose.ci.yml "$root/"
          rsync -a --delete docker/database/ "$root/docker/database/"
          printf '%s\n' "$GITHUB_SHA" > "$root/.deploy-commit"
          echo "已同步部署资产到 $root"

      - name: Deploy / 部署（迁移先行 → 换容器 → 健康检查）
        run: bash "$DEPLOY_ROOT/scripts/deploy.sh" --env staging --tag "develop-${{ steps.vars.outputs.sha_short }}"

  # ============================================================
  # Stage 7: 生产环境发布（Environment 人工审批后方可执行）
  # 仓库为 public，生产机不执行仓库代码——CI 只以受限参数调用服务器上那份
  # 可评审的 scripts/deploy.sh；两次 SSH 调用顺序不可颠倒：
  #   ①先把新的部署脚本/compose/迁移送到服务器 ②再执行部署
  # ============================================================
  deploy-production:
    name: Deploy Production / 生产环境发布
    runs-on: ubuntu-latest
    needs: [docker-web, docker-collector, docker-signer, docker-paper-trade]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 60
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ubuntu@49.233.145.117
      DEPLOY_PATH: /opt/investment

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      - name: Setup SSH key / 配置免密密钥与主机指纹
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve tag / 解析镜像标签（与 docker-* job 同规则：<branch>-<sha7>）
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Snapshot server state / 记录发布前现场
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && echo '--- 当前状态文件 ---' && cat .deploy-state 2>/dev/null; echo '--- 当前 APP_TAG ---' && grep -E '^APP_TAG=' .env 2>/dev/null; echo '--- 当前运行镜像 ---' && sudo docker compose -f docker-compose.prod.yml ps --format '{{.Service}} {{.Image}} {{.State}}' 2>/dev/null"

      - name: Sync deploy assets / 同步部署脚本、compose 与迁移到服务器
        # 生产机到 GitHub 的链路实测 100% 超时，发布资产不能从服务器侧拉取——
        # 改为 CI 侧打包直传：只送发布必需的资产，与 git checkout 等价（同一 commit）。
        # 提取以 root 执行：服务器上部分目录（如 docker/caddy/）属主为 root，
        # 非 root 提取会因覆盖失败而中断发布。
        run: |
          set -eu
          # COPYFILE_DISABLE：macOS 上打包不夹带 AppleDouble（._*）垃圾文件
          COPYFILE_DISABLE=1 tar -czf /tmp/deploy-assets.tar.gz \
            scripts/deploy.sh \
            docker/database \
            docker/caddy \
            docker-compose.prod.yml
          migration_count="$(find docker/database/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            /tmp/deploy-assets.tar.gz "$DEPLOY_HOST:/tmp/deploy-assets.tar.gz"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_HOST" \
            sudo bash -s -- "$DEPLOY_PATH" "$GITHUB_SHA" "$migration_count" <<'REMOTE'
          set -eu
          cd "$1"
          # --no-same-owner：不让归档里的 uid/gid 覆盖服务器属主，
          # 否则文件会挂上构建机 uid（服务器上不存在该用户）
          tar --no-same-owner -xzf /tmp/deploy-assets.tar.gz
          rm -f /tmp/deploy-assets.tar.gz
          chmod 755 scripts/deploy.sh
          printf '%s\n' "$2" > .deploy-commit
          # 资产落地完整性校验：缺任何一项都中止，不带着半套资产继续发布
          for f in scripts/deploy.sh docker-compose.prod.yml docker/caddy/Caddyfile docker/caddy/Dockerfile; do
              [ -f "$f" ] || { echo "ERROR: 资产缺失：$f" >&2; exit 1; }
          done
          n="$(find docker/database/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')"
          [ "$n" = "$3" ] || { echo "ERROR: 迁移文件数不符：期望 $3，实际 $n" >&2; exit 1; }
          echo "--- 已同步：迁移 $n 个，发布资产齐全 ---"
          REMOTE

      - name: Deploy / 发布（迁移先行 → 换容器 → 健康检查 → 失败自动回滚）
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && sudo bash scripts/deploy.sh --env prod --tag 'main-${{ steps.vars.outputs.sha_short }}'"
